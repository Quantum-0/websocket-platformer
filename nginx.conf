events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # 1. Раздача статических файлов игры (HTML и картинки)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # 2. Проксирование Веб-сокетов на Python-сервер
        location /ws {
            proxy_pass http://game_server:8001;
            
            # Важные заголовки для работы WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            # Передача реальных IP-адресов игроков серверу
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Тайм-аут, чтобы соединение не разрывалось при простое
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
